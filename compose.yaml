services:
  pgo-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${PGO_MCP_ENV_FILE:-resources/env/example.env}
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
    ports:
      - "127.0.0.1:${MCP_PUBLISH_PORT:-8001}:8001"
    networks:
      - postgres
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s

networks:
  postgres:
    external: true
    name: ${PGO_MCP_NETWORK:-pgo-mcp}
